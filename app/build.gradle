plugins {
    id 'com.android.application'
    id 'com.google.devtools.ksp'
    id 'androidx.room'
}

android {
    compileSdk 37

    defaultConfig {
        // must stay com.renju_note.isoo to update the existing Play Store listing
        applicationId "com.renju_note.isoo"
        minSdk 26
        targetSdk 36
        versionCode 9
        versionName "1.4.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        viewBinding = true
    }
    buildTypes {
        debug {
            // installs next to the Play Store version
            applicationIdSuffix ".test"
        }
        release {
            // board files are Java-serialized SeqTree, keep class/field names unobfuscated
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlin {
        jvmToolchain(17)
    }
    namespace 'com.renju_note.isoo'
}

room {
    schemaDirectory "$projectDir/schemas"
}

dependencies {
    implementation 'androidx.core:core-ktx:1.19.1'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    implementation "com.github.skydoves:colorpickerview:2.5.0"
    // glide
    implementation 'com.github.bumptech.glide:glide:5.0.9'
    ksp 'com.github.bumptech.glide:ksp:5.0.9'
    // room (recent file list)
    implementation 'androidx.room:room-runtime:2.8.5'
    implementation 'androidx.room:room-ktx:2.8.5'
    ksp 'androidx.room:room-compiler:2.8.5'
    // view model
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.11.0"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.11.0"
    implementation "androidx.fragment:fragment-ktx:1.9.1"
}
